[pytest]
testpaths = tests

# 기본 실행(`pytest`)에서 e2e 마커가 지정된 테스트를 제외한다.
#
# 주의: 이 설정은 마커 기반이다. tests/e2e/ 에 두더라도 @pytest.mark.e2e 를
# 빼먹으면 일반 pytest에서 실행된다. 모든 E2E 테스트에 반드시 마커를 지정한다.
# 경로 자동 마킹(conftest.py)과 공용 호스트 거부 검사는 추후 구현한다.
#
# E2E는 action_history·agent_run·approval_request·audit_log 등을 비운 격리 DB를
# 전제한다. 실행 방법은 docs/development-guide.md 4장을 따른다.
addopts = -m "not e2e"

markers =
    e2e: 격리 DB가 필요한 End-to-End 테스트. 공용 서버에서 실행 금지
    integration: 실제 PostgreSQL·Neo4j 연결이 필요한 테스트
    contract: Tool 5종 입출력 계약 테스트
    evaluation: 평가 지표 산출. 실행 시간이 길다
