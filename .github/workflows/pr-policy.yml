      # 기존 미등록 묶음·등록 가드·새 contract를 함께 고정한다. container/network 전용과
      # 선택 의존성 미설치 항목은 가드 내부 allowlist에 소유 이유를 남긴다.
      - name: Prove the previously unregistered unit contracts
        working-directory: backend
        env:
          # `app.common.config`가 import 시점에 요구하는 8종이다. 값은 접속용이 아니라
          # collection을 통과시키기 위한 더미다 — 이 묶음은 DB·Neo4j·n8n에 붙지 않는다.
          # 없으면 `RuntimeError: 필수 환경변수가 없습니다`로 collection 단계에서 죽는다.
