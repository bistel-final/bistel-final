  schema-rehearsal-container:
    name: Schema rehearsal container
    runs-on: ubuntu-latest

    env:
      # 최종 ZIP이 붙어 있는 release tag. **비밀이 아니라 repo variable이다** — 값 자체는
      # 태그 이름일 뿐이고, private asset 다운로드 권한은 `GITHUB_TOKEN`이 가진다.
      FINAL_ARCHIVE_RELEASE: ${{ vars.MENTOR_FINAL_ARCHIVE_RELEASE }}
      # Agent import의 공통 설정. 실제 DB 접속은 각 테스트의 one-off endpoint를 쓴다.
      POSTGRES_DB: kosa_agent
      POSTGRES_HOST: localhost
      READONLY_USER: kosa_readonly
      READONLY_PASSWORD: ci-not-a-secret
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-not-a-secret
      NEO4J_URI: bolt://localhost:7687
      N8N_WEBHOOK_URL: http://localhost:5678/webhook/fdc-notify-email

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # V5-C-4.1의 n8n Code node는 Node.js 표준 crypto·Buffer·URL을 사용한다.
      # 공용 n8n에 접속하지 않고 repository JSON에서 코드를 추출해 실행하므로,
      # workflow import/runtime 호환성은 후속 V5-C-4.2 Gate에 남긴다.
      - name: Set up Node.js for n8n workflow contracts
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `pgvector`도 vector 연산을 하려는 것이 아니다. `app.main`이
      # `knowledge/document_search.py`를 거치고 그 module 최상단이
      # `from pgvector.psycopg import register_vector`라, 없으면 `V5-CM-3.5`의
      # `tests/test_health.py`가 collection에서 죽는다. `sentence_transformers`는
      # 함수 안 지연 import라 필요 없다.
      #
      # `neo4j`는 Bolt에 붙기 위한 것이 **아니다.** `verify_bootstrap_state`가
      # module 최상단에서 `neo4j.exceptions`를 import하므로, full verifier를 부르는
      # `V5-CM-3.3` 회귀가 이것 없이는 collection 단계에서 죽는다.
      #
      # `numpy`·`scikit-learn`·`joblib`은 학습을 돌리기 위한 것이 아니다.
      # `V5-C-2.1` production 조립 회귀가 실제 `get_fdc_summary`를 import하고,
      # 그 runtime service가 Detection model·artifact loader를 import하므로 필요하다.
      - name: Install focused rehearsal dependencies
        run: >-
          python -m pip install
          pytest==8.3.4
          SQLAlchemy==2.0.36
          psycopg[binary]==3.2.3
          python-dotenv==1.0.1
          neo4j==5.26.0
          langgraph==0.2.53
          langgraph-checkpoint-postgres==2.0.9
          psycopg-pool==3.3.1
          sqlglot==26.0.1
          fastapi==0.115.6
          httpx==0.28.1
          pgvector==0.3.6
          numpy==2.1.3
          scikit-learn==1.5.2
          joblib==1.4.2

      # V5-A-2.1·V5-A-2.2·V5-A-3.2-1. 위 numpy·scikit-learn·joblib을 설치한
      # 바로 그 이유다 — 셋 다 `app.detection.model`(IsolationForest)을 직접
      # 또는 간접(`model_artifact`·`tools`)으로 import해서 `backend-unit-
      # contracts` job(그 셋이 없다)에는 등록할 수 없다. `test_fdc_summary_
      # tool.py`만 `app.common.config`까지 끌어오므로 아래 8종 dummy
      # 환경변수도 필요하다(그 job의 LangGraph step과 같은 이유·같은 값).
      # DB·model artifact는 전부 fake/monkeypatch라 `-m container`도, 실제
      # container도 필요 없다.
      - name: Prove the detection model and FDC summary contracts
        working-directory: backend
        env:
          POSTGRES_DB: kosa_agent
          POSTGRES_HOST: localhost
          READONLY_USER: kosa_readonly
          READONLY_PASSWORD: ci-not-a-secret
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ci-not-a-secret
          NEO4J_URI: bolt://localhost:7687
          N8N_WEBHOOK_URL: http://localhost:5678/webhook/fdc-notify-email
        run: >-
          python -m pytest -q
          tests/unit/test_detection_model.py
          tests/contract/test_score_boundary.py
          tests/unit/test_fdc_summary_tool.py
          -rs --no-header

      - name: Rehearse schema and prove rollback cleanup
        working-directory: backend
        run: >-
          python -m pytest -q -m container
          tests/unit/test_rehearsal_container.py

      # 격리 PostgreSQL 16에서 legacy 형상을 세우고 전환을 실증한다. 고정 backup
      # client image의 pg_dump/pg_restore version이 pin과 일치하는지도 여기서 본다.
      - name: Prove public transition on a real PostgreSQL
        working-directory: backend
        run: >-
          python -m pytest -q -m container
          tests/unit/test_postgres_transition_container.py

      # 격리 3-target으로 backup/restore·전환·재개·no-op를 한 흐름으로 돈다.
      # `pgvector/pgvector:pg16`(digest 고정)이 필요하다 — 순정 postgres:16에는
      # `vector` 확장이 없어 RAG 보존 검증을 할 수 없다.
      #
      # **최종 ZIP(34MB)은 저장소에 담지 않는다.** epoch 정본은 파일이 아니라
      # `infra/bootstrap/dataset-epoch.json`의 SHA-256 pin이고, 실물은 private release
      # asset으로 받는다.
      - name: Prove container contracts that need no final archive
        working-directory: backend
        run: >-
          python -m pytest -q -m container
          tests/unit/test_transition_e2e_container.py
          -k "not three_targets"

      # V5-CM-3.1 격리 회귀. archive 없이 도는 것들만 여기서 돌린다 — 최종 dataset이
      # 필요한 것은 아래 fetch 뒤 step이 맡는다(구현리뷰 12차 필수 4).
      - name: Prove V5 reference extension contracts
        working-directory: backend
        run: >-
          python -m pytest -q -m container
          tests/unit/test_reference_extensions_v5_container.py
          -rs --no-header

      # V5-CM-3.2 격리 회귀. 여기서는 **최종 dataset이 필요 없는 catalog 계약 7건**만
      # 돈다 — SQL이 만드는 catalog와 drift detector가 대상이라 base data가 없어도 된다.
      #
      # 선별은 `-k`가 아니라 `_final_archive()`의 skip에 맡긴다. `-k`는 test 이름을
      # 매칭하므로 fixture 의존을 가려낼 수 없다. runner 경로 17건은 TRACE 138·
      # SUMMARY 51을 요구하며 아래 fetch 뒤 step이 맡는다.
      - name: Prove Runtime 002 catalog contracts
        working-directory: backend
        run: >-
          python -m pytest -q -m container
          tests/unit/test_agent_runtime_v5_container.py
          -rs --no-header

      # V5-CM-3.4 LangGraph checkpoint 초기화. 최종 dataset이 필요 없다 —
      # package `setup()`이 만드는 4 table·3 index·version 0..8을 실측하고,
      # 부분 적용이 재실행으로 낫지 않는다는 전제를 DB로 고정한다.
      - name: Prove the checkpoint one-shot setup
        working-directory: backend
        run: >-
          python -m pytest -q -m container
          tests/unit/test_checkpoint_container.py
          -rs --no-header

      # V5-CM-4.7 E2E reset guard. unit은 target·intent·receipt·observer 분리를,
      # container는 일회성 `kosa_agent_e2e`에서 13-table transaction rollback·
      # writer race·commit/receipt fault window를 실증한다. 공용 DB는 접속하지 않는다.
      - name: Prove the E2E reset evidence contract
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/unit/test_e2e_reset_guard.py
          -rs --no-header

      - name: Prove E2E reset rollback and crash windows on PostgreSQL
        working-directory: backend
        run: >-
          python -m pytest -q -m container
          tests/unit/test_e2e_reset_guard_container.py
          -rs --no-header

      # V5-CM-3.4 묶음 2 준비. checkpoint 전용 backup 계약은 container가 필요 없다 —
      # 전환 backup(base 9)과 다른 계약이라는 것과 `restore_verified`가 관측 결과라는
      # 것을 순수 판정으로 고정한다. 지명하지 않으면 어느 job에도 잡히지 않는다.
      - name: Prove the checkpoint backup contract
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/unit/test_checkpoint_backup.py
          -rs --no-header

      # V5-CM-3.5 PostgreSQL 최소권한 role matrix.
      #
      # 이 workflow는 파일을 하나씩 지명하므로 신규 회귀를 적지 않으면 CI에서 실행되지
      # 않는다. 단위 회귀는 exact ACL·marker·snapshot 계약과, Runtime에서 권한을 회수한
      # `nl_query_log`가 Text2SQL 정책에서도 거부되는지를 함께 고정한다.
      - name: Prove the PostgreSQL role matrix contract
        working-directory: backend
        env:
          POSTGRES_DB: kosa_agent
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          APP_DB_USER: kosa_app
          APP_DATABASE_URL: ""
          APP_DB_PASSWORD: ""
          READONLY_USER: kosa_readonly
          READONLY_PASSWORD: ci-not-a-secret
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ci-not-a-secret
          NEO4J_URI: bolt://localhost:7687
          N8N_WEBHOOK_URL: http://localhost:5678/webhook/fdc-notify-email
        run: >-
          python -m pytest -q
          tests/unit/test_postgres_role_matrix.py
          tests/unit/test_sql_validator.py
          tests/unit/test_config_validation.py
          tests/unit/test_db_pool.py
          tests/unit/test_wbs_dependencies.py
          tests/test_health.py
          tests/contract/test_tool_contracts.py
          tests/contract/test_alarm_ref.py
          tests/contract/test_api_schemas.py
          tests/contract/test_error_contract.py
          -rs --no-header

      # Docker를 자동 기동하면 로컬 전체 pytest가 개발자 모르게 무거워진다. 그래서 test의
      # opt-in gate는 유지하되, 전용 CI step은 변수를 명시해 skip이 아니라 실제 3 DB ×
      # 5 role password-login·42501 음성 회귀를 수행한다.
      - name: Prove the PostgreSQL role matrix against real databases
        working-directory: backend
        env:
          RUN_POSTGRES_ROLE_MATRIX_CONTAINER: "1"
        run: >-
          python -m pytest -q -m container
          tests/unit/test_postgres_role_matrix_container.py
          -rs --no-header

      # V5-CM-4.8 Agent read Tool server hard timeout. 두 파일 모두 digest-pinned
      # 일회성 container만 사용한다. Docker/daemon 부재는 skip하지 않고 이 job을 실패시킨다.
      # production 5초 대신 test seam 150/200ms로 실제 취소·active 0·후속 query·LOCAL
      # 비누출을 증명하며 공용 PostgreSQL·Neo4j에는 접속하지 않는다.
      - name: Prove Agent read Tool hard timeout termination
        working-directory: backend
        env:
          POSTGRES_DB: kosa_agent
          POSTGRES_HOST: localhost
          READONLY_USER: kosa_readonly
          READONLY_PASSWORD: ci-not-a-secret
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ci-not-a-secret
          NEO4J_URI: bolt://localhost:7687
          N8N_WEBHOOK_URL: http://localhost:5678/webhook/fdc-notify-email
        run: >-
          python -m pytest -q -m container
          tests/unit/test_tool_timeout_postgres_container.py
          tests/unit/test_tool_timeout_neo4j_container.py
          -rs --no-header

      # V5-CM-3.4가 바꾼 계약의 단위 회귀. container가 필요 없다.
      #
      # workflow가 파일을 **하나씩 지명**하는 구조라 새 파일·수정 파일은 자동으로
      # 돌지 않는다. 이 Task가 stage registry(`manifest_v3`)·guard 분기
      # (`severity_pair_guard`)·verifier 배선(`verify_bootstrap_state`)을 바꿨으므로
      # 그 회귀도 함께 지명한다(구현리뷰 전 자체점검 3항).
      - name: Prove the checkpoint and stage contracts
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/unit/test_checkpoint_contract.py
          tests/unit/test_manifest_v3.py
          tests/unit/test_dataset_epoch.py
          tests/unit/test_severity_pair_guard.py
          tests/unit/test_verify_bootstrap_state.py
          -rs --no-header

      # V5-C-0.1 Runtime Repository.
      #
      # workflow가 파일을 **하나씩 지명**하므로 여기 적지 않으면 단위·container 어느
      # 쪽도 잡히지 않는다. 단위는 DB 없이 transaction 가드·입력 계약·label 격리·
      # 오류 변환을 보고, container는 실제 원자성과 제약 충돌을 본다.
      - name: Prove the Runtime Repository contract
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/unit/test_agent_repository.py
          -rs --no-header

      # 최종 dataset이 필요 없다 — `action_history` DDL과 002→003만 세운다.
      - name: Prove the Runtime Repository against PostgreSQL
        working-directory: backend
        env:
          # public read model 테스트가 `app.common.config`를 import 시점에 요구한다.
          # 값은 접속용이 아니라 collection 통과용 더미다.
          POSTGRES_DB: kosa_agent
          POSTGRES_HOST: localhost
          READONLY_USER: kosa_readonly
          READONLY_PASSWORD: ci-not-a-secret
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ci-not-a-secret
          NEO4J_URI: bolt://localhost:7687
          N8N_WEBHOOK_URL: http://localhost:5678/webhook/fdc-notify-email
        run: >-
          python -m pytest -q -m container
          tests/unit/test_agent_repository_container.py
          tests/unit/test_agent_public_api_container.py
          -rs --no-header

      # V5-C-0.2 thread·checkpoint 계약.
      #
      # 단위는 DB 없이 thread ID 정규화·fail-closed durability 판정과 **정적 회귀**를
      # 본다. 정적 회귀는 생산 모듈이 `setup()`·`from_conn_string()`·schema DDL을
      # 갖지 않는다는 것을 소스에서 직접 확인하므로 실행 경로만으로는 대체되지 않는다.
      - name: Prove the thread and checkpoint contract
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/unit/test_agent_checkpoint.py
          -rs --no-header

      # 최종 dataset이 필요 없다 — `action_history` DDL + 002→003 + checkpoint schema만
      # 세운다. **이 축은 실제 DB가 아니면 성립하지 않는다**: non-autocommit 연결이
      # checkpoint를 잃는다는 것과, interrupt 뒤 연결을 닫고 새 연결·새 saver로 같은
      # thread를 재개해도 이전 node가 다시 돌지 않는다는 것을 실측한다.
      - name: Prove thread resume across connections on PostgreSQL
        working-directory: backend
        run: >-
          python -m pytest -q -m container
          tests/unit/test_agent_checkpoint_container.py
          -rs --no-header

      # V5-CM-3.3 action/severity pair guard. 최종 dataset이 필요 없다 —
      # base `action_history` + 002 형상만 세우고 16조합 INSERT·rollback을 돌린다.
      - name: Prove the action/severity pair guard
        working-directory: backend
        run: >-
          python -m pytest -q -m container
          tests/unit/test_severity_pair_guard_container.py
          -rs --no-header

      # V5-C-1.1 incident 해석.
      #
      # 단위는 DB 없이 대표 정렬·요청 identity 보존·fail-closed mapping과 C-0.1
      # 오류 계층 재사용을 본다. `_translate()`는 C-0.1의 private 심볼이라 이 회귀가
      # 그 cross-module 의존을 고정한다.
      - name: Prove the incident resolution contract
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/unit/test_agent_incident.py
          -rs --no-header

      # 최종 dataset이 필요 없다 — legacy base 9 + wafer 폭 정정 + `v5/001`만 세운다.
      #
      # **이 축은 실제 View가 아니면 성립하지 않는다.** TRACE·SUMMARY는 LEFT JOIN이라
      # owner 결손 행이 남고, R03는 INNER JOIN에 자기 `lot_id·chamber_id`를 쓰므로
      # raw key와 owner key가 갈릴 수 있다. 단위 fake는 그 차이를 만들지 못한다.
      - name: Prove incident grouping against the real alarm view
        working-directory: backend
        run: >-
          python -m pytest -q -m container
          tests/unit/test_agent_incident_container.py
          -rs --no-header

      # V5-C-1.2 실제 WAFER routing·Process Step 결합.
      #
      # 단위는 B의 **실제 Pydantic DTO**로 graph 근거를 만든다. 평행 계약을 새로 정의하면
      # B가 DTO를 바꿔도 회귀가 green으로 남는다. 공용 Neo4j를 요구하지 않는다.
      - name: Prove the routing and graph cross-check contract
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/unit/test_agent_routing.py
          -rs --no-header

      # V5-C-2.1 LangGraph Level 1·2 골격. State 20 channel·Tool 감사 wrapper·
      # 14 canonical node와 fail-closed 분기는 공용 서비스 없이 결정론적으로 검증한다.
      - name: Prove the LangGraph state, Tool, and topology contracts
        working-directory: backend
        env:
          # `app.common.config`가 import 시점에 요구하는 8종이다. 값은 접속용이 아니라
          # collection을 통과시키기 위한 더미다 — 이 묶음은 DB·Neo4j·n8n에 붙지 않는다.
          # 없으면 `RuntimeError: 필수 환경변수가 없습니다`로 collection 단계에서 죽는다.
          POSTGRES_DB: kosa_agent
          POSTGRES_HOST: localhost
          READONLY_USER: kosa_readonly
          READONLY_PASSWORD: ci-not-a-secret
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ci-not-a-secret
          NEO4J_URI: bolt://localhost:7687
          N8N_WEBHOOK_URL: http://localhost:5678/webhook/fdc-notify-email
        run: >-
          python -m pytest -q
          tests/unit/test_agent_state.py
          tests/unit/test_agent_tool_boundary.py
          tests/unit/test_agent_tool_budget.py
          tests/unit/test_common_llm.py
          tests/unit/test_agent_prompts.py
          tests/unit/test_agent_hypothesis.py
          tests/unit/test_agent_decision.py
          tests/unit/test_agent_action_store.py
          tests/unit/test_agent_approval_store.py
          tests/unit/test_agent_rehydration.py
          tests/unit/test_agent_graph.py
          tests/unit/test_send_action_tool.py
          tests/unit/test_run_pending_incidents.py
          tests/unit/test_golden_flow.py
          tests/unit/test_golden_flow_evidence_tools.py
          tests/unit/test_fault_5class.py
          -rs --no-header

      # V5-C-4.1 n8n workflow repository 계약. JSON graph·exact schema·HMAC·callback
      # 분기와 변이 감도를 Node 22에서 검증하며 SMTP·Kafka·Backend에는 접속하지 않는다.
      - name: Prove the n8n workflow repository contracts
        working-directory: backend
        env:
          # email delivery unit이 `app.common.config` import 체인으로 요구하는 더미 8종.
          # 이 step은 DB·Neo4j·n8n에 붙지 않는다 — collection 통과용 값이다.
          POSTGRES_DB: kosa_agent
          POSTGRES_HOST: localhost
          READONLY_USER: kosa_readonly
          READONLY_PASSWORD: ci-not-a-secret
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ci-not-a-secret
          NEO4J_URI: bolt://localhost:7687
          N8N_WEBHOOK_URL: http://localhost:5678/webhook/fdc-notify-email
        run: >-
          python -m pytest -q
          tests/unit/test_n8n_workflows.py
          tests/unit/test_n8n_runtime_manifest.py
          tests/unit/test_email_delivery.py
          tests/unit/test_delivery_callback.py
          tests/unit/test_delivery_recovery.py
          tests/unit/test_mes_delivery.py
          tests/unit/test_send_email_smoke.py
          -rs --no-header

      # 실제 PostgreSQL 16에서 checkpoint 직렬화와 C 소유 incident·routing·Tool 감사·
      # run 종료 조립을 검증한다. 별도 회귀는 production FDC Tool만 격리 DB에 연결하고
      # 후속 business port를 fixture로 유지한다.
      - name: Prove LangGraph checkpoint and assembly on PostgreSQL
        working-directory: backend
        env:
          # 이 묶음도 `app.common.config`를 import한다 — 옮겨 온 production 배선 회귀가
          # Detection service를 끌어오기 때문이다. 위 unit step과 같은 더미 8종을 준다.
          POSTGRES_DB: kosa_agent
          POSTGRES_HOST: localhost
          READONLY_USER: kosa_readonly
          READONLY_PASSWORD: ci-not-a-secret
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ci-not-a-secret
          NEO4J_URI: bolt://localhost:7687
          N8N_WEBHOOK_URL: http://localhost:5678/webhook/fdc-notify-email
        run: >-
          python -m pytest -q -m container
          tests/unit/test_agent_approval_store_container.py
          tests/unit/test_email_delivery_container.py
          tests/unit/test_delivery_callback_container.py
          tests/unit/test_channel_idempotency_matrix.py
          tests/unit/test_mes_delivery_container.py
          tests/unit/test_agent_graph_container.py
          tests/unit/test_run_pending_incidents_container.py
          tests/unit/test_golden_flow_container.py
          tests/unit/test_fault_5class_container.py
          tests/unit/test_send_action_container.py
          tests/unit/test_agent_rehydration_container.py
          tests/unit/test_agent_resume_lock_container.py
          -rs --no-header

      # V5-C-1.3 중복 실행 방지.
      #
      # 단위는 fake Connection으로 **호출 순서**를 고정한다. lock → read 순서가 이
      # Task의 계약이고, 순서는 실제 DB 없이 관측된다. B runtime module을 import하지
      # 않으므로 focused 의존성·`.env` 없이 수집된다.
      - name: Prove the duplicate run guard order and policy
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/unit/test_agent_run_guard.py
          -rs --no-header

      # 최종 dataset이 필요 없다 — legacy base 9 + wafer 폭 정정 + `v5/001`만 세운다.
      #
      # **이 축은 실제 View가 아니면 성립하지 않는다.** `unnest` 두 배열의 순서쌍 대응,
      # source별 join 형상이 만드는 owner resolve, `(lot_id, wafer_id, chamber_id)`
      # unique 제약 부재가 만드는 fan-out은 단위 fake로 재현되지 않는다.
      - name: Verify generated Level 3 lifecycle schema and failure tables
        working-directory: backend
        run: python scripts/render_level3_lifecycle_contract.py --check

      - name: Prove WAFER route scope against the real alarm view
        working-directory: backend
        run: >-
          python -m pytest -q -m container
          tests/unit/test_agent_routing_container.py
          -rs --no-header

      # **이 축은 동시성이라 실제 DB가 아니면 성립하지 않는다.** advisory lock이 두
      # transaction을 실제로 직렬화하는지, commit·rollback에서 자동 해제되는지,
      # partial unique가 마지막 방어로 발화하는지, 기본 격리 수준이 실제로
      # `READ COMMITTED`인지는 단위 fake로 재현되지 않는다.
      #
      # base 9 + `v5/001`(incident 해석)과 `002`·`003`(run 생성)을 **한 컨테이너에**
      # 세운다. 이 Task가 두 계층을 동시에 쓰기 때문이다.
      - name: Prove the duplicate run guard against real advisory locks
        working-directory: backend
        run: >-
          python -m pytest -q -m container
          tests/unit/test_agent_run_guard_container.py
          -rs --no-header

      # **secret으로는 이 값을 만들 수 없다.** secret은 48KB 한도라 ZIP을 담지 못하고,
      # 경로 문자열을 담아도 runner에는 그 파일이 없다. 그래서 asset을 실제로 내려받고
      # 그 경로를 `GITHUB_ENV`로 넘긴다(PR #108 리뷰 확인 2).
      #
      # 태그가 지정되지 않으면 이 단계가 건너뛰어지고 아래 경고 단계가 그 사실을
      # annotation과 job summary로 남긴다. 회색 skip은 신호가 아니다.
      - name: Fetch the final archive
        if: ${{ env.FINAL_ARCHIVE_RELEASE != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="${RUNNER_TEMP}/project.zip"
          gh release download "${FINAL_ARCHIVE_RELEASE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'project.zip' \
            --output "${target}"
          # hash 대조는 테스트의 `assert_archive_is_pinned()`가 한다. 다른 ZIP을 붙여도
          # 여기서 통과하고 거기서 실패한다.
          echo "MENTOR_FINAL_ARCHIVE=${target}" >> "${GITHUB_ENV}"

      - name: Prove investigation history and metrology against final data
        working-directory: backend
        env:
          POSTGRES_DB: kosa_agent
          POSTGRES_HOST: localhost
          READONLY_USER: kosa_readonly
          READONLY_PASSWORD: ci-not-a-secret
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ci-not-a-secret
          NEO4J_URI: bolt://localhost:7687
          N8N_WEBHOOK_URL: http://localhost:5678/webhook/fdc-notify-email
        run: >-
          python -m pytest -q -m container
          tests/unit/test_agent_investigation_container.py
          -rs --no-header

      - name: Prove the three-target transition with the actual final archive
        if: ${{ env.MENTOR_FINAL_ARCHIVE != '' }}
        working-directory: backend
        run: >-
          python -m pytest -q -m container
          tests/unit/test_transition_e2e_container.py
          -k three_targets
          -p no:randomly
          --no-header -rA

      - name: Prove the V5 final-dataset E2E with the actual final archive
        if: ${{ env.MENTOR_FINAL_ARCHIVE != '' }}
        working-directory: backend
        run: >-
          python -m pytest -q -m container
          tests/unit/test_reference_extensions_v5_container.py
          -p no:randomly
          --no-header -rA

      - name: Prove the Runtime 002 runner with the actual final archive
        if: ${{ env.MENTOR_FINAL_ARCHIVE != '' }}
        working-directory: backend
        run: >-
          python -m pytest -q -m container
          tests/unit/test_agent_runtime_v5_container.py
          -p no:randomly
          --no-header -rA

      - name: Warn that the three-target transition is unproven
        if: ${{ env.MENTOR_FINAL_ARCHIVE == '' }}
        run: |
          echo "::warning title=3-target 전환 E2E 미검증::MENTOR_FINAL_ARCHIVE가 없어 production entrypoint 3-target 회귀를 실행하지 못했다. repo variable MENTOR_FINAL_ARCHIVE_RELEASE에 최종 ZIP이 붙은 release tag를 설정하라."
          {
            echo "### ⚠️ 최종 dataset E2E 미검증 (CM-2.6 3-target · CM-3.1 0/189·3/192 · CM-3.2 runner)"
            echo
            echo "- CM-2.6 \`test_production_entrypoints_transition_three_targets\`"
            echo "  backup·transition CLI를 둘 다 production \`main()\`으로 완주시키는 유일한 회귀"
            echo "- CM-3.1 최종 ZIP 9 CSV 기반 0/189·3/192·TRACE 138·SUMMARY 51 실증"
            echo "- CM-3.2 Runtime 002 runner — rehearsal rollback·fresh apply·adopt·no-op과"
            echo "  final data gate(TRACE 138·SUMMARY 51·null owner 0·R03 0/3) 음성 회귀"
            echo "- C-7.1 investigation history/metrology — 최종 데이터 실조회 미검증"
            echo
            echo "archive 없이 도는 회귀는 위 step에서 실행됐다(skip 목록은 \`-rs\` 출력)."
            echo
            echo "활성화: repo variable \`MENTOR_FINAL_ARCHIVE_RELEASE\` = 최종 \`project.zip\`이"
            echo "asset으로 붙은 release tag."
          } >> "${GITHUB_STEP_SUMMARY}"

  mes-kafka-roundtrip:
    name: MES Kafka round-trip
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused Kafka contract dependencies
        run: >-
          python -m pip install
          pytest==8.3.4
          SQLAlchemy==2.0.36
          psycopg[binary]==3.2.3
          pydantic==2.10.3
          httpx==0.28.1
          confluent-kafka==2.6.1
          python-dotenv==1.0.1

      - name: Start isolated Kafka 3.9.1
        run: >-
          docker compose -p bistel-mes-test
          -f backend/tests/fixtures/v5_c_4_5/docker-compose.yml
          up -d --wait kafka

      - name: Create exact MES topics
        run: >-
          docker compose -p bistel-mes-test
          -f backend/tests/fixtures/v5_c_4_5/docker-compose.yml
          exec -T kafka /opt/team/manage_topics.sh ensure-topics kafka:9092

      - name: Prove MES result ack then input commit
        working-directory: backend
        env:
          # `app.common.config`가 import 시점에 요구하는 8종 — unit job과 같은 더미다.
          POSTGRES_DB: kosa_agent
          POSTGRES_HOST: localhost
          READONLY_USER: kosa_readonly
          READONLY_PASSWORD: ci-not-a-secret
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ci-not-a-secret
          NEO4J_URI: bolt://localhost:7687
          N8N_WEBHOOK_URL: http://localhost:5678/webhook/fdc-notify-email
          MES_KAFKA_TEST_BOOTSTRAP: localhost:39092
        run: >-
          python -m pytest -q -m container
          tests/unit/test_mes_kafka_container.py
          -rs --no-header

      - name: Start the file-only MES Mock consumer
        run: >-
          docker compose -p bistel-mes-test
          -f backend/tests/fixtures/v5_c_4_5/docker-compose.yml
          --profile consumer up -d --build mes-mock

      - name: Prove the container entrypoint reads only mounted secrets
        working-directory: backend
        env:
          POSTGRES_DB: kosa_agent
          POSTGRES_HOST: localhost
          READONLY_USER: kosa_readonly
          READONLY_PASSWORD: ci-not-a-secret
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ci-not-a-secret
          NEO4J_URI: bolt://localhost:7687
          N8N_WEBHOOK_URL: http://localhost:5678/webhook/fdc-notify-email
          MES_KAFKA_TEST_BOOTSTRAP: localhost:39092
          MES_MOCK_SERVICE_RUNNING: "1"
        run: >-
          python -m pytest -q -m container
          tests/unit/test_mes_kafka_container.py
          -k file_only_consumer_service_publishes_result
          -rs --no-header

      - name: Remove only the isolated Kafka project
        if: ${{ always() }}
        run: >-
          docker compose -p bistel-mes-test
          -f backend/tests/fixtures/v5_c_4_5/docker-compose.yml
          --profile consumer
          down -v --remove-orphans
