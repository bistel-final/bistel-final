name: PR Policy

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest

    env:
      PR_BRANCH: ${{ github.head_ref }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}

    steps:
      - name: Validate branch name
        shell: bash
        run: |
          set -euo pipefail

          branch_pattern='^(feat|fix|refactor|test|docs|chore)/(common|detection|knowledge|agent|analytics|integration)-[a-z0-9]+(-[a-z0-9]+)*$'

          if [[ ! "$PR_BRANCH" =~ $branch_pattern ]]; then
            echo "잘못된 브랜치명입니다: $PR_BRANCH"
            echo "형식: <type>/<area>-<description>"
            echo "예시: feat/detection-summary"
            exit 1
          fi

      # Squash merge 라서 PR 제목이 main 의 커밋 메시지가 된다.
      # 커밋 규칙과 같은 형식을 쓴다. 담당 영역은 제목이 아니라 라벨로 표시한다.
      - name: Validate pull request title
        shell: bash
        run: |
          set -euo pipefail

          title_pattern='^(feat|fix|refactor|test|docs|chore): .+$'

          if [[ ! "$PR_TITLE" =~ $title_pattern ]]; then
            echo "잘못된 PR 제목입니다: $PR_TITLE"
            echo "형식: <type>: <한 줄 요약>"
            echo "type: feat | fix | refactor | test | docs | chore"
            echo "예시: feat: FDC 요약 조회 API 구현"
            exit 1
          fi

      - name: Validate required sections
        shell: bash
        run: |
          set -euo pipefail

          required_headings=(
            "## 변경 내용"
            "## 변경 이유"
          )

          for heading in "${required_headings[@]}"; do
            if ! printf '%s\n' "$PR_BODY" | grep -Fq "$heading"; then
              echo "필수 항목이 없습니다: $heading"
              exit 1
            fi
          done

  corrected-dataset-windows:
    name: Corrected dataset Windows
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependency
        run: python -m pip install pytest==8.3.4

      - name: Verify Windows locking and concurrent activation
        run: >-
          python -m pytest -q
          backend/tests/unit/test_build_corrected_dataset.py
          -k "windows_lock_backend or parallel_same_build or parallel_different_builds"

      - name: Verify cross-platform rehearsal lifecycle contract
        run: >-
          python -m pytest -q
          backend/tests/unit/test_rehearsal_postgres.py

  schema-rehearsal-container:
    name: Schema rehearsal container
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused rehearsal dependencies
        run: >-
          python -m pip install
          pytest==8.3.4
          SQLAlchemy==2.0.36
          psycopg[binary]==3.2.3
          python-dotenv==1.0.1

      - name: Rehearse schema and prove rollback cleanup
        working-directory: backend
        run: >-
          python -m pytest -q -m container
          tests/unit/test_rehearsal_container.py
