        run: >-
          python -m pip install
          pytest==8.3.4
          SQLAlchemy==2.0.36
          psycopg[binary]==3.2.3
          python-dotenv==1.0.1
          neo4j==5.26.0
          langgraph==0.2.53
          langgraph-checkpoint-postgres==2.0.9
