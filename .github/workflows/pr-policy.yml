name: PR Policy

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest

    env:
      PR_BRANCH: ${{ github.head_ref }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}

    steps:
      - name: Validate branch name
        shell: bash
        run: |
          set -euo pipefail

          branch_pattern='^(feat|fix|refactor|test|docs|chore)/(common|detection|knowledge|agent|analytics|integration)-[a-z0-9]+(-[a-z0-9]+)*$'

          if [[ ! "$PR_BRANCH" =~ $branch_pattern ]]; then
            echo "잘못된 브랜치명입니다: $PR_BRANCH"
            echo "형식: <type>/<area>-<description>"
            echo "예시: feat/detection-summary"
            exit 1
          fi

      # Squash merge 라서 PR 제목이 main 의 커밋 메시지가 된다.
      # 커밋 규칙과 같은 형식을 쓴다. 담당 영역은 제목이 아니라 라벨로 표시한다.
      - name: Validate pull request title
        shell: bash
        run: |
          set -euo pipefail

          title_pattern='^(feat|fix|refactor|test|docs|chore): .+$'

          if [[ ! "$PR_TITLE" =~ $title_pattern ]]; then
            echo "잘못된 PR 제목입니다: $PR_TITLE"
            echo "형식: <type>: <한 줄 요약>"
            echo "type: feat | fix | refactor | test | docs | chore"
            echo "예시: feat: FDC 요약 조회 API 구현"
            exit 1
          fi

      - name: Validate required sections
        shell: bash
        run: |
          set -euo pipefail

          required_headings=(
            "## 변경 내용"
            "## 변경 이유"
          )

          for heading in "${required_headings[@]}"; do
            if ! printf '%s\n' "$PR_BODY" | grep -Fq "$heading"; then
              echo "필수 항목이 없습니다: $heading"
              exit 1
            fi
          done

  # `V5-CM-1.6`이 corrected 계열을 삭제하면서 이 job에서 corrected step만 뺐다.
  # **job 자체는 남긴다** — rehearsal lifecycle·recovery lock·V5 artifact write·공용
  # 전환 argv 계약이 Windows에서 도는 곳은 여기뿐이라, 통째로 지우면 그 검증들이 함께
  # 사라진다(계획리뷰 2차 권장 3).
  windows-contract:
    name: Windows contract
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependency
        run: python -m pip install pytest==8.3.4

      - name: Verify cross-platform rehearsal lifecycle contract
        run: >-
          python -m pytest -q
          backend/tests/unit/test_rehearsal_postgres.py

      # substring `-k` 대신 등록된 marker로 대상을 고정한다. `-k "store"`는
      # `test_recover_restores_marker_only`까지 잡아 SQLAlchemy를 요구했다
      # (구현리뷰 2차 필수 1). `windows_contract`는 pytest만으로 통과해야 한다.
      - name: Verify recovery marker lock and store on Windows
        run: >-
          python -m pytest -q
          backend/tests/unit/test_rehearsal_recovery.py
          -m windows_contract

      # V5-CM-3.1 artifact 저장은 platform 경계를 탄다 — 디렉터리 fsync는 POSIX 전용이고
      # `os.replace`는 Windows에서 기존 파일을 덮기 위한 선택이다(구현리뷰 12차 권장 1).
      - name: Verify V5 artifact write contract on Windows
        run: >-
          python -m pytest -q
          backend/tests/unit/test_reference_extensions_v5.py
          -m windows_contract

      # 아래 설치는 위 세 step **뒤**에 둔다. `V5-CM-2.5`가 세운
      # "windows_contract는 pytest만으로 통과" 계약을 CI 수준에서도 지키기 위해서다
      # (계획리뷰 3차 권장 1). 버전은 backend/requirements.txt와 exact 일치한다.
      - name: Install transition contract dependencies
        run: >-
          python -m pip install
          SQLAlchemy==2.0.36
          psycopg[binary]==3.2.3
          python-dotenv==1.0.1

      - name: Verify public transition path and argv contract on Windows
        run: >-
          python -m pytest -v
          backend/tests/unit/test_postgres_backup.py
          backend/tests/unit/test_postgres_transition.py
          backend/tests/unit/test_transition_public_postgres.py
          backend/tests/unit/test_transition_orchestration.py
          -m windows_contract

      - name: Show which transition contracts Windows actually collected
        run: >-
          python -m pytest --collect-only -q
          backend/tests/unit/test_postgres_backup.py
          backend/tests/unit/test_postgres_transition.py
          backend/tests/unit/test_transition_public_postgres.py
          backend/tests/unit/test_transition_orchestration.py
          -m windows_contract

  schema-rehearsal-container:
    name: Schema rehearsal container
    runs-on: ubuntu-latest

    env:
      # 최종 ZIP이 붙어 있는 release tag. **비밀이 아니라 repo variable이다** — 값 자체는
      # 태그 이름일 뿐이고, private asset 다운로드 권한은 `GITHUB_TOKEN`이 가진다.
      FINAL_ARCHIVE_RELEASE: ${{ vars.MENTOR_FINAL_ARCHIVE_RELEASE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused rehearsal dependencies
        run: >-
          python -m pip install
          pytest==8.3.4
          SQLAlchemy==2.0.36
          psycopg[binary]==3.2.3
          python-dotenv==1.0.1

      - name: Rehearse schema and prove rollback cleanup
        working-directory: backend
        run: >-
          python -m pytest -q -m container
          tests/unit/test_rehearsal_container.py

      # 격리 PostgreSQL 16에서 legacy 형상을 세우고 전환을 실증한다. 고정 backup
      # client image의 pg_dump/pg_restore version이 pin과 일치하는지도 여기서 본다.
      - name: Prove public transition on a real PostgreSQL
        working-directory: backend
        run: >-
          python -m pytest -q -m container
          tests/unit/test_postgres_transition_container.py

      # 격리 3-target으로 backup/restore·전환·재개·no-op를 한 흐름으로 돈다.
      # `pgvector/pgvector:pg16`(digest 고정)이 필요하다 — 순정 postgres:16에는
      # `vector` 확장이 없어 RAG 보존 검증을 할 수 없다.
      #
      # **최종 ZIP(34MB)은 저장소에 담지 않는다.** epoch 정본은 파일이 아니라
      # `infra/bootstrap/dataset-epoch.json`의 SHA-256 pin이고, 실물은 private release
      # asset으로 받는다.
      - name: Prove container contracts that need no final archive
        working-directory: backend
        run: >-
          python -m pytest -q -m container
          tests/unit/test_transition_e2e_container.py
          -k "not three_targets"

      # V5-CM-3.1 격리 회귀. archive 없이 도는 것들만 여기서 돌린다 — 최종 dataset이
      # 필요한 것은 아래 fetch 뒤 step이 맡는다(구현리뷰 12차 필수 4).
      - name: Prove V5 reference extension contracts
        working-directory: backend
        run: >-
          python -m pytest -q -m container
          tests/unit/test_reference_extensions_v5_container.py
          -rs --no-header

      # V5-CM-3.2 격리 회귀. 여기서는 **최종 dataset이 필요 없는 catalog 계약 7건**만
      # 돈다 — SQL이 만드는 catalog와 drift detector가 대상이라 base data가 없어도 된다.
      #
      # 선별은 `-k`가 아니라 `_final_archive()`의 skip에 맡긴다. `-k`는 test 이름을
      # 매칭하므로 fixture 의존을 가려낼 수 없다. runner 경로 17건은 TRACE 138·
      # SUMMARY 51을 요구하며 아래 fetch 뒤 step이 맡는다.
      - name: Prove Runtime 002 catalog contracts
        working-directory: backend
        run: >-
          python -m pytest -q -m container
          tests/unit/test_agent_runtime_v5_container.py
          -rs --no-header

      # **secret으로는 이 값을 만들 수 없다.** secret은 48KB 한도라 ZIP을 담지 못하고,
      # 경로 문자열을 담아도 runner에는 그 파일이 없다. 그래서 asset을 실제로 내려받고
      # 그 경로를 `GITHUB_ENV`로 넘긴다(PR #108 리뷰 확인 2).
      #
      # 태그가 지정되지 않으면 이 단계가 건너뛰어지고 아래 경고 단계가 그 사실을
      # annotation과 job summary로 남긴다. 회색 skip은 신호가 아니다.
      - name: Fetch the final archive
        if: ${{ env.FINAL_ARCHIVE_RELEASE != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="${RUNNER_TEMP}/project.zip"
          gh release download "${FINAL_ARCHIVE_RELEASE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'project.zip' \
            --output "${target}"
          # hash 대조는 테스트의 `assert_archive_is_pinned()`가 한다. 다른 ZIP을 붙여도
          # 여기서 통과하고 거기서 실패한다.
          echo "MENTOR_FINAL_ARCHIVE=${target}" >> "${GITHUB_ENV}"

      - name: Prove the three-target transition with the actual final archive
        if: ${{ env.MENTOR_FINAL_ARCHIVE != '' }}
        working-directory: backend
        run: >-
          python -m pytest -q -m container
          tests/unit/test_transition_e2e_container.py
          -k three_targets
          -p no:randomly
          --no-header -rA

      - name: Prove the V5 final-dataset E2E with the actual final archive
        if: ${{ env.MENTOR_FINAL_ARCHIVE != '' }}
        working-directory: backend
        run: >-
          python -m pytest -q -m container
          tests/unit/test_reference_extensions_v5_container.py
          -p no:randomly
          --no-header -rA

      - name: Prove the Runtime 002 runner with the actual final archive
        if: ${{ env.MENTOR_FINAL_ARCHIVE != '' }}
        working-directory: backend
        run: >-
          python -m pytest -q -m container
          tests/unit/test_agent_runtime_v5_container.py
          -p no:randomly
          --no-header -rA

      - name: Warn that the three-target transition is unproven
        if: ${{ env.MENTOR_FINAL_ARCHIVE == '' }}
        run: |
          echo "::warning title=3-target 전환 E2E 미검증::MENTOR_FINAL_ARCHIVE가 없어 production entrypoint 3-target 회귀를 실행하지 못했다. repo variable MENTOR_FINAL_ARCHIVE_RELEASE에 최종 ZIP이 붙은 release tag를 설정하라."
          {
            echo "### ⚠️ 최종 dataset E2E 미검증 (CM-2.6 3-target · CM-3.1 0/189·3/192 · CM-3.2 runner)"
            echo
            echo "- CM-2.6 \`test_production_entrypoints_transition_three_targets\`"
            echo "  backup·transition CLI를 둘 다 production \`main()\`으로 완주시키는 유일한 회귀"
            echo "- CM-3.1 최종 ZIP 9 CSV 기반 0/189·3/192·TRACE 138·SUMMARY 51 실증"
            echo "- CM-3.2 Runtime 002 runner — rehearsal rollback·fresh apply·adopt·no-op과"
            echo "  final data gate(TRACE 138·SUMMARY 51·null owner 0·R03 0/3) 음성 회귀"
            echo
            echo "archive 없이 도는 회귀는 위 step에서 실행됐다(skip 목록은 \`-rs\` 출력)."
            echo
            echo "활성화: repo variable \`MENTOR_FINAL_ARCHIVE_RELEASE\` = 최종 \`project.zip\`이"
            echo "asset으로 붙은 release tag."
          } >> "${GITHUB_STEP_SUMMARY}"
