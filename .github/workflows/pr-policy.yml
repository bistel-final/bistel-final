name: PR Policy

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest

    env:
      PR_BRANCH: ${{ github.head_ref }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}

    steps:
      - name: Validate branch name
        shell: bash
        run: |
          set -euo pipefail

          branch_pattern='^(feat|fix|refactor|test|docs|chore)/(common|detection|knowledge|agent|analytics|integration)-[a-z0-9]+(-[a-z0-9]+)*$'

          if [[ ! "$PR_BRANCH" =~ $branch_pattern ]]; then
            echo "잘못된 브랜치명입니다: $PR_BRANCH"
            echo "형식: <type>/<area>-<description>"
            echo "예시: feat/detection-summary"
            exit 1
          fi

      # Squash merge 라서 PR 제목이 main 의 커밋 메시지가 된다.
      # 커밋 규칙과 같은 형식을 쓴다. 담당 영역은 제목이 아니라 라벨로 표시한다.
      - name: Validate pull request title
        shell: bash
        run: |
          set -euo pipefail

          title_pattern='^(feat|fix|refactor|test|docs|chore): .+$'

          if [[ ! "$PR_TITLE" =~ $title_pattern ]]; then
            echo "잘못된 PR 제목입니다: $PR_TITLE"
            echo "형식: <type>: <한 줄 요약>"
            echo "type: feat | fix | refactor | test | docs | chore"
            echo "예시: feat: FDC 요약 조회 API 구현"
            exit 1
          fi

      - name: Validate required sections
        shell: bash
        run: |
          set -euo pipefail

          required_headings=(
            "## 변경 내용"
            "## 변경 이유"
          )

          for heading in "${required_headings[@]}"; do
            if ! printf '%s\n' "$PR_BODY" | grep -Fq "$heading"; then
              echo "필수 항목이 없습니다: $heading"
              exit 1
            fi
          done

  frontend-contract:
    name: Frontend contract
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify navigation contract
        working-directory: frontend
        run: npm run test:navigation

      - name: Verify shared client contract
        working-directory: frontend
        run: npm run test:shared-client

      - name: Verify Agent screen assembly contract
        working-directory: frontend
        run: npm run test:agent-screen

      - name: Verify Agent investigation components and public trace fixture
        working-directory: frontend
        run: npm run test:agent-investigation

      - name: Verify API schema-derived mock contract
        working-directory: frontend
        run: npm run test:api-schema

      - name: Verify Action sort and tab contract
        working-directory: frontend
        run: npm run test:actions-sort

      - name: Verify Detection screen state contract
        working-directory: frontend
        run: npm run test:detection-screen

      - name: Verify Ontology graph assembly contract
        working-directory: frontend
        run: npm run test:ontology

      - name: Verify integration E2E frontend contract
        working-directory: frontend
        run: npm run test:integration-e2e

  # `V5-CM-1.6`이 corrected 계열을 삭제하면서 이 job에서 corrected step만 뺐다.
  # **job 자체는 남긴다** — rehearsal lifecycle·recovery lock·V5 artifact write·공용
  # 전환 argv 계약이 Windows에서 도는 곳은 여기뿐이라, 통째로 지우면 그 검증들이 함께
  # 사라진다(계획리뷰 2차 권장 3).
  windows-contract:
    name: Windows contract
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependency
        run: python -m pip install pytest==8.3.4

      - name: Verify cross-platform rehearsal lifecycle contract
        run: >-
          python -m pytest -q
          backend/tests/unit/test_rehearsal_postgres.py

      # substring `-k` 대신 등록된 marker로 대상을 고정한다. `-k "store"`는
      # `test_recover_restores_marker_only`까지 잡아 SQLAlchemy를 요구했다
      # (구현리뷰 2차 필수 1). `windows_contract`는 pytest만으로 통과해야 한다.
      - name: Verify recovery marker lock and store on Windows
        run: >-
          python -m pytest -q
          backend/tests/unit/test_rehearsal_recovery.py
          -m windows_contract

      # V5-CM-3.1 artifact 저장은 platform 경계를 탄다 — 디렉터리 fsync는 POSIX 전용이고
      # `os.replace`는 Windows에서 기존 파일을 덮기 위한 선택이다(구현리뷰 12차 권장 1).
      - name: Verify V5 artifact write contract on Windows
        run: >-
          python -m pytest -q
          backend/tests/unit/test_reference_extensions_v5.py
          -m windows_contract

      # 아래 설치는 위 세 step **뒤**에 둔다. `V5-CM-2.5`가 세운
      # "windows_contract는 pytest만으로 통과" 계약을 CI 수준에서도 지키기 위해서다
      # (계획리뷰 3차 권장 1). 버전은 backend/requirements.txt와 exact 일치한다.
      - name: Install transition contract dependencies
        run: >-
          python -m pip install
          SQLAlchemy==2.0.36
          psycopg[binary]==3.2.3
          python-dotenv==1.0.1

      - name: Verify public transition path and argv contract on Windows
        run: >-
          python -m pytest -v
          backend/tests/unit/test_postgres_backup.py
          backend/tests/unit/test_postgres_transition.py
          backend/tests/unit/test_transition_public_postgres.py
          backend/tests/unit/test_transition_orchestration.py
          -m windows_contract

      - name: Show which transition contracts Windows actually collected
        run: >-
          python -m pytest --collect-only -q
          backend/tests/unit/test_postgres_backup.py
          backend/tests/unit/test_postgres_transition.py
          backend/tests/unit/test_transition_public_postgres.py
          backend/tests/unit/test_transition_orchestration.py
          -m windows_contract

  # 저장소 test 파일을 하나씩 지명하는 기존 workflow에서 빠졌던 unit contract를
  # 별도 수집한다. Docker를 쓰지 않는 빠른 묶음이므로 container job과 병렬로 실행하고,
  # registration 회귀가 이후의 새 누락도 막는다.
  backend-unit-contracts:
    name: Backend unit contracts
    runs-on: ubuntu-latest

    steps:
